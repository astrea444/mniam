<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.webp" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mniam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <style>
      .app-initial-skeleton {
        box-sizing: border-box;
        padding: 1.5rem 1rem;
        max-width: 480px;
        margin: 0 auto;
        font-family: 'Poppins', sans-serif;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .sk-block {
        background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
        background-size: 200% 100%;
        animation: sk-shimmer 1.5s infinite linear;
        border-radius: 1rem;
      }
      .sk-header { height: 2.5rem; width: 60%; }
      .sk-sub { height: 1.2rem; width: 40%; margin-top: -0.8rem; }
      .sk-card-lg { height: 10rem; width: 100%; border-radius: 1.25rem; }
      .sk-card-sm { height: 4.5rem; width: 100%; border-radius: 1rem; }
      @keyframes sk-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
    <div id="app">
      <div class="app-initial-skeleton">
        <div class="sk-block sk-header"></div>
        <div class="sk-block sk-sub"></div>
        <div class="sk-block sk-card-lg"></div>
        <div class="sk-block sk-card-sm"></div>
        <div class="sk-block sk-card-sm"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
